name: Deploy BallKnw to GitHub Pages

on:
  push:
    branches: [claude/build-vnqqbp]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Build the Hub (Vite/React) app. Its output goes to /hub/ (see
      # hub-src/vite.config.ts outDir) so GitHub Pages can serve /hub/.
      - name: Build Hub app
        run: |
          cd hub-src
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
