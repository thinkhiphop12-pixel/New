    <line x1="-65" y1="-91" x2="39" y2="65" stroke="#00ff88" stroke-width="8" opacity="0.35"/>
    <line x1="65" y1="-91" x2="-39" y2="65" stroke="#00ff88" stroke-width="8" opacity="0.35"/>

    <circle cx="0" cy="0" r="46" fill="none" stroke="#00ff88" stroke-width="8" opacity="0.5"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="#00ff88" stroke-width="5" opacity="0.35"/>
  </g>

  <!-- Wordmark (bottom) -->
  <g transform="translate(256, 480)">
    <text x="0" y="-60" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="80" letter-spacing="2" fill="#00ff88">BALL</text>
    <text x="0" y="60" text-anchor="middle" dominant-baseline="central" font-family="'Press Start 2P', cursive" font-weight="400" font-size="40" letter-spacing="1" fill="#00ff88">KNOWLEDGE</text>
