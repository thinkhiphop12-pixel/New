    <line x1="-130" y1="-39" x2="130" y2="-39" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>
    <line x1="-130" y1="39" x2="130" y2="39" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>
    <line x1="-130" y1="78" x2="130" y2="78" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>

    <line x1="-78" y1="-130" x2="-78" y2="130" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>
    <line x1="-39" y1="-130" x2="-39" y2="130" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#0a0e14" stroke-width="5" opacity="0.3"/>
