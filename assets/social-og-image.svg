<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
  <!-- Open Graph / Social share image: 1200×628px -->
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1219;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051015;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ogBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="628" fill="url(#ogBg)"/>

  <!-- Logo mark (left side) -->
  <g transform="translate(200, 314)">
    <circle cx="0" cy="0" r="140" fill="url(#ogBall)" stroke="none"/>

    <line x1="-140" y1="-84" x2="140" y2="-84" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="-140" y1="-42" x2="140" y2="-42" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="-140" y1="42" x2="140" y2="42" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="-140" y1="84" x2="140" y2="84" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>

    <line x1="-84" y1="-140" x2="-84" y2="140" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="-42" y1="-140" x2="-42" y2="140" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="42" y1="-140" x2="42" y2="140" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>
    <line x1="84" y1="-140" x2="84" y2="140" stroke="#0a0e14" stroke-width="6" opacity="0.3"/>

    <line x1="-70" y1="-98" x2="42" y2="70" stroke="#00ff88" stroke-width="8" opacity="0.35"/>
    <line x1="70" y1="-98" x2="-42" y2="70" stroke="#00ff88" stroke-width="8" opacity="0.35"/>

    <circle cx="0" cy="0" r="49" fill="none" stroke="#00ff88" stroke-width="8" opacity="0.5"/>
    <circle cx="0" cy="0" r="31" fill="none" stroke="#00ff88" stroke-width="6" opacity="0.35"/>
  </g>

  <!-- Headline text (center-right) -->
  <text x="600" y="220" text-anchor="middle" font-family="'Press Start 2P', cursive" font-weight="400" font-size="72" fill="#00ff88" letter-spacing="2">BALL KNOWLEDGE</text>

  <!-- Subheadline -->
  <text x="600" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="32" fill="#e8e8e8" letter-spacing="1">Football Games for Obsessives</text>

  <!-- URL footer -->
  <text x="600" y="570" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#8892a0">ballknw.com</text>

  <!-- Accent line -->
  <line x1="200" y1="350" x2="1000" y2="350" stroke="#00ff88" stroke-width="3" opacity="0.4"/>
</svg>
