<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Discord server icon: 512×512px, logo mark on gradient background -->
  <defs>
    <linearGradient id="discordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:0.25" />
    </linearGradient>
    <linearGradient id="discordBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0a0e14"/>
  <rect width="512" height="512" fill="url(#discordGrad)"/>

  <!-- Centered logo mark -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="160" fill="url(#discordBall)" stroke="none"/>

    <line x1="-160" y1="-96" x2="160" y2="-96" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="-160" y1="-48" x2="160" y2="-48" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="-160" y1="48" x2="160" y2="48" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="-160" y1="96" x2="160" y2="96" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>

    <line x1="-96" y1="-160" x2="-96" y2="160" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="-48" y1="-160" x2="-48" y2="160" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="48" y1="-160" x2="48" y2="160" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>
    <line x1="96" y1="-160" x2="96" y2="160" stroke="#0a0e14" stroke-width="7" opacity="0.3"/>

    <line x1="-80" y1="-112" x2="48" y2="80" stroke="#00ff88" stroke-width="10" opacity="0.35"/>
    <line x1="80" y1="-112" x2="-48" y2="80" stroke="#00ff88" stroke-width="10" opacity="0.35"/>

    <circle cx="0" cy="0" r="56" fill="none" stroke="#00ff88" stroke-width="10" opacity="0.5"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00ff88" stroke-width="7" opacity="0.35"/>
  </g>
</svg>
