<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Gaffa</title>
  <meta http-equiv="refresh" content="0; url=/gaffa/">
  <link rel="canonical" href="https://ballknw.com/gaffa/">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050505;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
    }
    p {
      font-size: 1.1rem;
      color: #8a8a8e;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #b8ff3c 0%, #00d68f 100%);
      color: #04140b;
      padding: 14px 26px;
      border-radius: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.12s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 44px rgba(184, 255, 60, 0.22);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>This game has moved to Gaffa</h1>
    <p>The game has been rebranded and relocated. You'll be automatically redirected to the new URL in a moment.</p>
    <a href="/gaffa/">Go to Gaffa now →</a>
  </div>
  <script>
    // Immediate redirect for JavaScript-enabled browsers
    location.replace('/gaffa/');
  </script>
</body>
</html>
