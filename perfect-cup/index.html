  // ---------- Draft engine (engine/draft.ts) ----------
  function createDraftState(pool) {

      player: player,
      squadId: squad.id,
      squadLabel: squad.flag + " " + squad.countryName + " " + squad.tournamentYear
    });
    state.currentSquad = null;
    if (state.seenSquadIds.indexOf(squad.id) === -1) state.seenSquadIds.push(squad.id);
    return state;
  }
  function editionCandidates(state, pool) {
    if (!state.currentSquad) return [];
    var cs = state.currentSquad;
    return pool.filter(function (s) {
      return s.countryName === cs.countryName && s.id !== cs.id && offersNeededPlayer(state, s);
    });
  }
  function squadCandidates(state, pool) {
    if (!state.currentSquad) return [];
    var cs = state.currentSquad;
    return pool.filter(function (s) {
      return s.tournamentYear === cs.tournamentYear && s.id !== cs.id && offersNeededPlayer(state, s);
    });
  }
  function canSwapEdition(state, pool) {
    return !state.swapEditionUsed && state.currentSquad !== null && editionCandidates(state, pool).length > 0;
  }
  function canSwapSquad(state, pool) {
    return !state.swapSquadUsed && state.currentSquad !== null && squadCandidates(state, pool).length > 0;
  }
  function swapEdition(state, pool) {
    if (!canSwapEdition(state, pool)) return state;
    var c = editionCandidates(state, pool);
    state.swapEditionUsed = true;
    return markSquadSeen(state, c[Math.floor(Math.random() * c.length)]);
  }
  function swapSquad(state, pool) {
    if (!canSwapSquad(state, pool)) return state;
    var c = squadCandidates(state, pool);
    state.swapSquadUsed = true;
    return markSquadSeen(state, c[Math.floor(Math.random() * c.length)]);
  }
  function draftStrength(state) {
    if (state.picks.length === 0) return 0;
    var sum = state.picks.reduce(function (a, p) { return a + p.player.rating; }, 0);
    return Math.round(sum / state.picks.length);
  }

  // ---------- Simulation (engine/simulate.ts) ----------
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function poissonRandom(lambda) {
    var limit = Math.exp(-lambda), k = 0, p = 1;
    do { k += 1; p *= Math.random(); } while (p > limit);
    return k - 1;
  }
  function expectedGoals(attack, defense) { return clamp(1.35 + (attack - defense) / 16, 0.2, 5.5); }
  function pickOpponent(round, totalRounds, pool) {
    var targetPct = round / totalRounds;
    var ranked = pool.slice().sort(function (a, b) {
      return Math.abs(a.strengthPct - targetPct) - Math.abs(b.strengthPct - targetPct);
    });
    var bandSize = Math.max(3, Math.floor(ranked.length * 0.08));
    var band = ranked.slice(0, bandSize);
    return band[Math.floor(Math.random() * band.length)] || pool[0];
  }
  function outcomeFor(a, b) { return a > b ? "win" : a < b ? "loss" : "draw"; }
  function simulateRun(teamStrength, allSquads, usedSquadIds) {
    var pool = allSquads.filter(function (s) { return !usedSquadIds.has(s.id); });
    var opponentPool = pool.length > 0 ? pool : allSquads;
    var matches = [], goalsFor = 0, goalsAgainst = 0, wins = 0, draws = 0, losses = 0, knockoutLoss = false;
    for (var round = 1; round <= TOTAL_MATCHES; round++) {
      var r = ROUNDS[round - 1];
      var opponent = pickOpponent(round, TOTAL_MATCHES, opponentPool);
      var ourGoals = poissonRandom(expectedGoals(teamStrength, opponent.strength));
      var opponentGoals = poissonRandom(expectedGoals(opponent.strength, teamStrength));
      if (r.stage === "knockout" && ourGoals === opponentGoals) {
        if (Math.random() < 0.5) ourGoals += 1; else opponentGoals += 1;
      }
      var outcome = outcomeFor(ourGoals, opponentGoals);
      if (outcome === "win") wins += 1; else if (outcome === "draw") draws += 1; else losses += 1;
      if (outcome !== "win" && r.stage === "knockout") knockoutLoss = true;
      goalsFor += ourGoals; goalsAgainst += opponentGoals;
      matches.push({
        round: round, roundName: r.name, stage: r.stage,
        opponent: opponent.flag + " " + opponent.countryName + " " + opponent.tournamentYear,
        ourGoals: ourGoals, opponentGoals: opponentGoals, outcome: outcome
      });
      if (r.stage === "knockout" && outcome !== "win") break;
    }
    return {
      matches: matches, goalsFor: goalsFor, goalsAgainst: goalsAgainst,
      isPerfect: wins === TOTAL_MATCHES, isChampion: !knockoutLoss,
      finalRecord: wins + "-" + draws + "-" + losses
    };
  }
  function makeRunId() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "run-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }
  function buildRun(picks, teamStrength, sim, pool, objective) {
    return {
      id: makeRunId(), date: new Date().toISOString(), pool: pool, objective: objective,
      picks: picks, matches: sim.matches, goalsFor: sim.goalsFor, goalsAgainst: sim.goalsAgainst,
      isPerfect: sim.isPerfect, isChampion: sim.isChampion,
      success: objective === "perfect" ? sim.isPerfect : sim.isChampion,
      finalRecord: sim.finalRecord, teamStrength: teamStrength
    };
  }

  // ---------- Run history (localStorage) ----------
  function loadRuns() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveRun(run) {
    var runs = loadRuns();
    runs = runs.filter(function (r) { return r.id !== run.id; });
    runs.unshift(run);
    runs = runs.slice(0, 100);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(runs)); } catch (e) {}
  }
  function clearRuns() { try { localStorage.removeItem(HISTORY_KEY); } catch (e) {} }

  // ---------- DOM helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function on(sel, ev, fn) {
    var el = typeof sel === "string" ? root.querySelector(sel) : sel;
    if (el) el.addEventListener(ev, fn);
  }
  function onAll(sel, ev, fn) {
    root.querySelectorAll(sel).forEach(function (el) { el.addEventListener(ev, fn); });
  }

    if (view.screen === "start") return renderStart();

    if (view.screen === "history") return renderHistory();
  }

      var pick = picksOfPos[used[pos]];
      used[pos] += 1;
      return { pos: pos, pick: pick };
    });
  }

        '<div class="pc-lineup-head"><span>YOUR XI</span><span>' + (complete ? "Five complete" : "Pick " + spinNumber + " of 5") + '</span></div>' +

  var revealing = false;
  function withSpinner(action, delay) {
    if (revealing) return;
    revealing = true;
    root.innerHTML = '<div class="pc-screen"><div class="pc-draft__spinner"><div class="pc-spinner"></div><p>Spinning the globe…</p></div></div>';
    window.setTimeout(function () { action(); revealing = false; render(); }, delay);
  }

  function startSimulation() {
    view.screen = "simulating"; render();
    window.setTimeout(function () {
      var state = view.draft;
      var usedSquadIds = new Set(state.picks.map(function (p) { return p.squadId; }));
      var teamStrength = Math.round(state.picks.reduce(function (a, p) { return a + p.player.rating; }, 0) / state.picks.length);
      var sim = simulateRun(teamStrength, ALL_SQUADS, usedSquadIds);
      var run = buildRun(state.picks, teamStrength, sim, state.pool, view.objective);
      saveRun(run);
      view.activeRun = run; view.fromHistory = false; view.screen = "result"; render();
    }, 1100);
  }

  function renderSimulating() {
    root.innerHTML = '<div class="pc-screen pc-simulating"><div class="pc-spinner pc-spinner--large"></div>' +
      '<h2>Simulating the run…</h2><p>' +
      (view.objective === "perfect" ? "Three group games and five knockout rounds. Win all eight." : "Through the group stage to the final. Lift the trophy.") +
      '</p></div>';
  }

  function headline(run) {
    if (run.objective === "perfect") return run.isPerfect ? "Perfect run — " + run.finalRecord : "Run ended";
    return run.isChampion ? "World Champions" : "Knocked out";
  }
  function buildShareText(run) {
    var head = run.objective === "perfect"
      ? (run.isPerfect ? "I went 8-0 in BALLKNW Draft XI!" : "BALLKNW Draft XI run: " + run.finalRecord)
      : (run.isChampion ? "I won the BALLKNW Draft XI Cup! (" + run.finalRecord + ")" : "BALLKNW Draft XI run: " + run.finalRecord);
    return head + "\nTeam strength: " + run.teamStrength + "\nballknw.com/perfect-cup/";
  }

  function renderResult() {
    var run = view.activeRun;
    var animate = view.revealMode === "watch" && !view.fromHistory;
    renderResultBody(run, animate ? 0 : run.matches.length);

      var n = 0;

  function renderHistory() {

    onAll("[data-rid]", "click", function () {
      var rid = this.getAttribute("data-rid");
      var run = loadRuns().filter(function (r) { return r.id === rid; })[0];
      if (run) { view.activeRun = run; view.fromHistory = true; view.screen = "result"; render(); }
    });
    on("#backBtn", "click", function () { view.screen = "start"; render(); });
    on("#clearBtn", "click", function () { clearRuns(); render(); });
  }

  // ---------- Boot ----------
  fetch("data/squads.json")
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (data) { ALL_SQUADS = data.squads; render(); })
    .catch(function (err) {
      root.innerHTML = '<div class="pc-error"><p>Couldn\'t load squad data.</p><p><a href="/">Back to BALLKNW</a></p></div>';
    });
})();
</script>
</body>
</html>
