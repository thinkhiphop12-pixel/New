<body class="bg-zinc-950 text-zinc-200">
    <div class="max-w-lg mx-auto px-5 pt-8 pb-12">
        <!-- Header -->

                </div>
            </div>

            <div class="text-right">
                <div class="flex items-center justify-end gap-1.5">
                    <i class="fa-solid fa-fire text-orange-400 streak-flame"></i>
                    <span id="streak-count" class="font-mono text-2xl font-bold text-orange-400">0</span>
                </div>
                <div class="text-[10px] text-zinc-500 -mt-1">DAY STREAK</div>
            </div>

        <!-- Instructions -->
        <div class="text-center mb-6">
            <p class="text-zinc-400 text-sm">Group these 16 footballers into <span class="font-semibold">4 sets of 4</span> by a hidden theme.<br>4 wrong guesses and it's over.</p>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center text-zinc-500 py-10">Loading player database…</div>

        <!-- Game Area -->
        <div id="game-area" class="hidden">
            <!-- Mistakes -->
            <div class="flex items-center justify-center gap-2 mb-4">
                <span class="text-xs text-zinc-500 uppercase tracking-widest mr-1">Mistakes</span>
                <div id="mistakes-row" class="flex gap-1.5"></div>
            </div>

            <!-- Solved groups -->
            <div id="solved-groups" class="flex flex-col gap-2 mb-3"></div>

            <!-- One away hint -->
            <div id="one-away" class="hidden text-center text-amber-400 text-sm font-semibold mb-2">One away…</div>

            <!-- Card grid -->
            <div id="card-grid" class="card-grid mb-4"></div>

            <div class="flex gap-3">
                <button id="deselect-btn" onclick="deselectAll()"
                        class="flex-1 py-3 border border-zinc-700 hover:bg-zinc-900 rounded-2xl text-sm font-semibold">
                    Deselect all
                </button>
                <button id="shuffle-btn" onclick="shuffleBoard()"

                    <i class="fa-solid fa-shuffle"></i> Shuffle
                </button>
                <button id="submit-btn" onclick="submitGuess()" disabled
                        class="flex-1 py-3 bg-emerald-400 disabled:bg-zinc-800 disabled:text-zinc-600 hover:bg-emerald-300 active:bg-emerald-500 text-emerald-950 font-extrabold rounded-2xl transition">
                    Submit
                </button>

        <!-- Results -->

            <div class="text-center mb-6">
                <div id="result-title" class="font-display text-4xl tracking-tight mb-1"></div>
                <div id="result-subtitle" class="text-zinc-400"></div>
            </div>
        </div>

        <!-- Streak Stats -->
        <div class="mt-10 text-center text-xs text-zinc-500">
            <div class="flex justify-center gap-6">
                <div>Current streak: <span id="current-streak" class="font-mono text-emerald-400">0</span></div>
                <div>Best streak: <span id="best-streak" class="font-mono text-emerald-400">0</span></div>
            </div>
            <div class="mt-1">Played: <span id="played-count" class="font-mono">0</span></div>
        </div>
    </div>

    <script>
        // ==================== SCOUT: DAILY FOOTBALL CONNECTIONS ====================

        let POOL = [];
        let GROUPS = [];       // the 4 hidden groups for today: { label, players: [4 players] }
        let solvedOrder = [];  // indices into GROUPS, in the order the player solved them
        let board = [];        // remaining (unsolved) player objects, current display order
        let selected = [];     // names currently selected on the board
        let mistakes = 0;
        let guessHistory = [];
        let finished = false;
        let won = false;

        const MAX_MISTAKES = 4;

        function getTodayKey() {
            const d = new Date();
            return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
        }

        function dailyHash() {
            const key = getTodayKey();
            let h = 0;
            for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0;
            return Math.abs(h);
        }

        function getDayOfYear() {
            const date = new Date();
            const start = new Date(date.getFullYear(), 0, 0);
            return Math.floor((date - start) / 86400000);
        }

        // Seeded PRNG (mulberry32) so today's puzzle is the same for everyone, all day.
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function seededShuffle(arr, rand) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        async function init() {
            try {
                const res = await fetch('./data/players.json');
                const data = await res.json();
                const all = [...(data.players || []), ...(data.icons || [])];
                const candidates = all.filter((p) => p && p.n && (p.icon || p.o >= 78));
                const byName = new Map();
                candidates.forEach((p) => {
                    const existing = byName.get(p.n);
                    if (!existing || (p.o || 0) > (existing.o || 0)) byName.set(p.n, p);
                });
                POOL = Array.from(byName.values());

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('game-area').classList.remove('hidden');
                document.getElementById('puzzle-number').textContent = 'SCOUT #' + getDayOfYear();

                loadStreakStats();
                startDaily();
            } catch (e) {
                document.getElementById('loading').textContent = 'Could not load player data. Please refresh.';
            }
        }

        function buildPuzzle(seed) {
            function counts(keyFn) {
                const m = new Map();
                POOL.forEach((p) => {
                    const k = keyFn(p);
                    if (k === undefined || k === null) return;
                    m.set(k, (m.get(k) || 0) + 1);
                });
                return m;
            }

            const nationCounts = counts((p) => p.country);
            const nations = Array.from(nationCounts.keys()).filter((k) => nationCounts.get(k) >= 6).sort();

            const posCounts = counts((p) => p.sp);
            const positions = Array.from(posCounts.keys()).filter((k) => posCounts.get(k) >= 6).sort();

            const tiers = [
                { min: 90, max: 100, label: 'Rated 90+ — icon class' },
                { min: 85, max: 89, label: 'Rated 85–89 — world class' },
                { min: 80, max: 84, label: 'Rated 80–84 — elite' },
                { min: 74, max: 79, label: 'Rated 74–79 — very good' },
            ];

            const yearCounts = counts((p) => (typeof p.year === 'number' ? p.year : null));
            const years = Array.from(yearCounts.keys()).filter((k) => yearCounts.get(k) >= 6).sort((a, b) => a - b);

            const usedNames = new Set();

            function pickGroup(options, poolFn, labelFn, typeIndex) {
                for (let attempt = 0; attempt < options.length; attempt++) {
                    const idx = (seed + typeIndex * 97 + attempt) % options.length;
                    const opt = options[idx];
                    const candidatePool = POOL.filter((p) => poolFn(p, opt) && !usedNames.has(p.n));
                    if (candidatePool.length >= 4) {
                        const rand = mulberry32(seed + typeIndex * 1000 + attempt);
                        const picked = seededShuffle(candidatePool, rand).slice(0, 4);
                        picked.forEach((p) => usedNames.add(p.n));
                        return { label: labelFn(opt), players: picked };
                    }
                }
                return null;
            }

            const groups = [
                pickGroup(nations, (p, c) => p.country === c, (c) => `All played for ${c}`, 0),
                pickGroup(positions, (p, s) => p.sp === s, (s) => `All play as ${s}`, 1),
                pickGroup(tiers, (p, t) => p.o >= t.min && p.o <= t.max, (t) => t.label, 2),
                pickGroup(years, (p, y) => p.year === y, (y) => `Featured at the ${y} World Cup`, 3),
            ].filter(Boolean);

            return groups;
        }

        function startDaily() {
            const seed = dailyHash();
            GROUPS = buildPuzzle(seed);
            solvedOrder = [];
            mistakes = 0;
            guessHistory = [];
            finished = false;
            won = false;
            selected = [];

            const allPlayers = GROUPS.flatMap((g) => g.players);
            board = seededShuffle(allPlayers, mulberry32(seed + 777));

            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('results-area').classList.add('hidden');
            renderMistakes();
            renderSolved();
            renderBoard();
            updateSubmitState();

            const key = getTodayKey();
            const saved = JSON.parse(localStorage.getItem('connect_daily_' + key) || 'null');
            if (saved && saved.done) {
                // Replay today's saved outcome (locked, read-only view of the finished puzzle).
                mistakes = saved.mistakes;
                guessHistory = saved.guessHistory;
                won = saved.won;
                solvedOrder = GROUPS.map((_, i) => i);
                board = [];
                finished = true;
                renderMistakes();
                renderSolved();
                renderBoard();
                showResults(won);
            }
        }

        function findGroupIndex(name) {
            return GROUPS.findIndex((g) => g.players.some((p) => p.n === name));
        }

        function renderMistakes() {
            const row = document.getElementById('mistakes-row');
            row.innerHTML = '';
            for (let i = 0; i < MAX_MISTAKES; i++) {
                const dot = document.createElement('div');
                dot.className = 'mistake-dot' + (i < mistakes ? ' used' : '');
                row.appendChild(dot);
            }
        }

        function renderSolved() {
            const wrap = document.getElementById('solved-groups');
            wrap.innerHTML = '';
            solvedOrder.forEach((gi) => {
                const g = GROUPS[gi];
                const row = document.createElement('div');
                row.className = 'solved-row grp-' + gi;
                row.innerHTML = `<div class="theme">${g.label}</div><div class="names">${g.players.map((p) => p.n).join(' · ')}</div>`;
                wrap.appendChild(row);
            });
        }

        function renderBoard() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            board.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'player-card' + (selected.includes(p.n) ? ' selected' : '');
                card.textContent = p.n;
                card.onclick = () => toggleSelect(p.n);
                grid.appendChild(card);
            });
        }

        function toggleSelect(name) {
            if (finished) return;
            if (selected.includes(name)) {
                selected = selected.filter((n) => n !== name);
            } else {
                if (selected.length >= 4) return;
                selected.push(name);
            }
            renderBoard();
            updateSubmitState();
        }

        function deselectAll() {
            if (finished) return;
            selected = [];
            renderBoard();
            updateSubmitState();
        }

        function shuffleBoard() {
            if (finished) return;
            board = seededShuffle(board, Math.random);
            renderBoard();
        }

        function updateSubmitState() {
            document.getElementById('submit-btn').disabled = selected.length !== 4;
        }

        function submitGuess() {
            if (finished || selected.length !== 4) return;

            const groupIdxs = selected.map(findGroupIndex);
            guessHistory.push(groupIdxs.slice());
            const oneGroup = groupIdxs[0];
            const isMatch = oneGroup !== -1 && groupIdxs.every((gi) => gi === oneGroup);

            document.getElementById('one-away').classList.add('hidden');

            if (isMatch) {
                solvedOrder.push(oneGroup);
                board = board.filter((p) => !selected.includes(p.n));
                selected = [];
                renderSolved();
                renderBoard();
                updateSubmitState();

                if (solvedOrder.length === GROUPS.length) {
                    finish(true);
                }
            } else {
                mistakes++;
                renderMistakes();

                const counts = {};
                groupIdxs.forEach((gi) => { counts[gi] = (counts[gi] || 0) + 1; });
                const maxShared = Math.max(...Object.values(counts));
                if (maxShared === 3) {
                    document.getElementById('one-away').classList.remove('hidden');
                }

                selected = [];
                renderBoard();
                updateSubmitState();

                if (mistakes >= MAX_MISTAKES) {
                    // Reveal remaining groups in their natural order.
                    for (let gi = 0; gi < GROUPS.length; gi++) {
                        if (!solvedOrder.includes(gi)) solvedOrder.push(gi);
                    }
                    board = [];
                    renderSolved();
                    renderBoard();
                    finish(false);
                }
            }
        }

        function finish(didWin) {
            finished = true;
            won = didWin;
            const key = getTodayKey();
            localStorage.setItem('connect_daily_' + key, JSON.stringify({ mistakes, guessHistory, won, done: true }));
            recordDailyResult(didWin);
            setTimeout(() => showResults(didWin), 350);
        }

        function loadStreakStats() {
            document.getElementById('streak-count').textContent = localStorage.getItem('connect_streak') || '0';
            document.getElementById('current-streak').textContent = localStorage.getItem('connect_streak') || '0';
            document.getElementById('best-streak').textContent = localStorage.getItem('connect_best_streak') || '0';
            document.getElementById('played-count').textContent = localStorage.getItem('connect_played') || '0';
        }

        function recordDailyResult(didWin) {
            const key = getTodayKey();
            const lastKey = localStorage.getItem('connect_last_result_date');
            if (lastKey === key) return; // already recorded today

            localStorage.setItem('connect_last_result_date', key);
            const played = parseInt(localStorage.getItem('connect_played') || '0', 10) + 1;
            localStorage.setItem('connect_played', played);

            let streak = parseInt(localStorage.getItem('connect_streak') || '0', 10);
            streak = didWin ? streak + 1 : 0;
            localStorage.setItem('connect_streak', streak);

            let best = parseInt(localStorage.getItem('connect_best_streak') || '0', 10);
            if (streak > best) localStorage.setItem('connect_best_streak', streak);

            loadStreakStats();
        }

        function showResults(didWin) {
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('results-area').classList.remove('hidden');

            const titleEl = document.getElementById('result-title');
            const subEl = document.getElementById('result-subtitle');
            if (didWin) {
                titleEl.innerHTML = `🎉 Solved!`;
                subEl.textContent = `${MAX_MISTAKES - mistakes} of ${MAX_MISTAKES} lives to spare.`;
            } else {
                titleEl.innerHTML = `Next time`;
                subEl.textContent = `The groups are revealed above. Streak reset.`;
            }
        }

        init();
    </script>
