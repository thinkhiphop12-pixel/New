[build]
  publish = "."
  command = "npm ci && npm run build && cd hub-src && npm ci && npm run build"

[[redirects]]
  from = "http://ballknw.com/*"
  to = "https://ballknw.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ballknw.com/*"
  to = "https://ballknw.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ballknw.com/*"
  to = "https://ballknw.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/hub/*"
  to = "/hub/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hub/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
